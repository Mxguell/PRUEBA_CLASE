
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Web</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #0f172a, #7c3aed);
    }
    .card {
      text-align: center;
      padding: 40px;
      border: 1px solid #ffffff40;
      border-radius: 24px;
      background: #ffffff12;
      backdrop-filter: blur(12px);
    }
    h1 { font-size: 2.5rem; }
    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 30px;
      background: white;
      color: #6d28d9;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ Hola, mundo</h1>
    <p>Diseño simple. Ideas increíbles.</p>
    <button onclick="alert('¡Vamos allá! 🚀')">
      Descubrir
    </button>
  </div>
</body>
</html>
